apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: pre-prod
  namespace: demo
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: demo-app
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/kargobook/demo-gitops.git
      steps:
      - uses: git-clone
        as: clone
        config:
          repoURL: ${{ vars.gitRepo }}
          checkout:
          - branch: main
            path: ./repo
      - uses: yaml-update
        as: update
        config:
          path: ./repo/envs/pre-prod/values.yaml
          updates:
          # The chart deploys by the digest below. The tag is written only
          # to keep the values file readable.
          - key: image.tag
            value: ${{ imageFrom("ghcr.io/kargobook/demo-app").Tag }}
          - key: image.digest
            value: ${{ imageFrom("ghcr.io/kargobook/demo-app").Digest }}
      - uses: git-commit
        as: commit
        config:
          path: ./repo
          message: 'Promote to pre-prod: ${{ imageFrom("ghcr.io/kargobook/demo-app").Tag }}'
      - uses: git-push
        as: push
        config:
          path: ./repo
          targetBranch: main
      - uses: argocd-update
        as: sync
        config:
          apps:
          - name: demo-pre-prod
